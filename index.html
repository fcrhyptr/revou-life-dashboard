<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Life Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ===================== HEADER / GREETING ===================== -->
  <header class="header">
    <div class="greeting-section">
      <p id="greeting-text" class="greeting-text">Selamat Pagi!</p>
      <h1 id="clock" class="clock">00:00:00</h1>
      <p id="date-text" class="date-text">Senin, 1 Januari 2025</p>
    </div>

    <!-- Tombol Light/Dark Mode -->
    <button id="theme-toggle" class="btn-icon" aria-label="Toggle tema">
      <span id="theme-icon">🌙</span>
    </button>
  </header>

  <!-- ===================== KONTEN UTAMA ===================== -->
  <main class="main-grid">

    <!-- --------- FOCUS TIMER (POMODORO) --------- -->
    <section class="card timer-card">
      <h2 class="card-title">🍅 Focus Timer</h2>
      <div class="timer-display" id="timer-display">25:00</div>
      <div class="timer-controls">
        <button id="btn-start" class="btn btn-primary">Start</button>
        <button id="btn-stop" class="btn btn-secondary">Stop</button>
        <button id="btn-reset" class="btn btn-outline">Reset</button>
      </div>
    </section>

    <!-- --------- TO-DO LIST --------- -->
    <section class="card todo-card">
      <h2 class="card-title">✅ To-Do List</h2>

      <!-- Form tambah tugas -->
      <div class="todo-input-group">
        <input
          type="text"
          id="todo-input"
          class="input-field"
          placeholder="Tambah tugas baru..."
          maxlength="100"
        />
        <button id="btn-add-todo" class="btn btn-primary">Tambah</button>
      </div>

      <!-- Pesan error duplikat -->
      <p id="todo-error" class="error-msg hidden"></p>

      <!-- Kontrol pengurutan -->
      <div class="sort-controls">
        <label for="sort-select" class="sort-label">Urutkan:</label>
        <select id="sort-select" class="select-field">
          <option value="default">Urutan asli</option>
          <option value="name-asc">Nama A–Z</option>
          <option value="name-desc">Nama Z–A</option>
          <option value="completed">Selesai dahulu</option>
          <option value="active">Belum selesai dahulu</option>
        </select>
      </div>

      <!-- Daftar tugas -->
      <ul id="todo-list" class="todo-list">
        <!-- Item tugas akan diisi oleh JavaScript -->
      </ul>
    </section>

    <!-- --------- QUICK LINKS --------- -->
    <section class="card links-card">
      <h2 class="card-title">🔗 Quick Links</h2>

      <!-- Form tambah tautan -->
      <div class="links-input-group">
        <input
          type="text"
          id="link-name-input"
          class="input-field"
          placeholder="Nama tautan..."
          maxlength="50"
        />
        <input
          type="url"
          id="link-url-input"
          class="input-field"
          placeholder="https://..."
          maxlength="200"
        />
        <button id="btn-add-link" class="btn btn-primary">Tambah</button>
      </div>

      <!-- Pesan error link -->
      <p id="link-error" class="error-msg hidden"></p>

      <!-- Daftar tautan -->
      <ul id="links-list" class="links-list">
        <!-- Item tautan akan diisi oleh JavaScript -->
      </ul>
    </section>

  </main>

  <!-- ===================== FOOTER ===================== -->
  <footer class="footer">
    <p>Life Dashboard &copy; 2026 · Fachri Hernawan Putra</p>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
